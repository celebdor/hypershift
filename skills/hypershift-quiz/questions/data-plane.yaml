# Data plane (NodePool / CAPI) questions. Schema: skills/hypershift-quiz/SKILL.md
- id: data-np-creates
  topic: data-plane
  depth: 1
  format: mcq
  question: |
    Which CAPI resources does the NodePool controller create in the control
    plane namespace?
  options:
    - text: MachineDeployment, a platform MachineTemplate (e.g. AWSMachineTemplate), and a MachineHealthCheck
      correct: true
    - text: Machine and MachineSet objects directly, bypassing the MachineDeployment
      correct: false
    - text: Only the MachineDeployment — CAPI providers create everything else including the template
      correct: false
    - text: Node objects in the guest cluster
      correct: false
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    The NodePool controller owns the desired state (MachineDeployment +
    template + health check); CAPI's MachineDeployment controller derives
    MachineSets and Machines from it, and the infrastructure provider
    creates the actual instances. HyperShift never touches Machines
    directly.

- id: data-rollout-hash
  topic: data-plane
  depth: 2
  format: explain
  question: |
    A change to `spec.config` on a NodePool triggers a full node rollout.
    Trace the chain from the config change to the rolling update, naming the
    objects involved at each step.
  rubric:
    must_cover:
      - The NodePool controller's ConfigGenerator computes a config hash over the rendered config (plus release version and other inputs)
      - A new hash means new token and userdata Secrets are created
      - The MachineDeployment's spec.template.bootstrap.dataSecretName is pointed at the new userdata Secret
      - The bootstrap/template change makes CAPI perform a rolling update of the Machines
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    The config hash is the contract between "what the user changed" and
    "what rolls out". This is also why any change that feeds the hash rolls
    out every NodePool fleet-wide — the repo's CLAUDE.md calls this out as
    a review checkpoint.

- id: data-upgrade-type
  topic: data-plane
  depth: 2
  format: mcq
  question: |
    What is the default NodePool `spec.management.upgradeType`, and what
    does the alternative do?
  options:
    - text: Replace (default) — new machines are created with the new config and old ones deleted; InPlace updates existing machines without replacing them
      correct: true
    - text: InPlace (default) — existing machines are updated in place; Replace creates new machines
      correct: false
    - text: Replace means rebooting nodes to apply new MachineConfigs
      correct: false
    - text: upgradeType is ignored — the HostedCluster release always dictates node upgrades
      correct: false
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    Replace is the default because it is the most reliable: new machines
    boot with the full new ignition payload. InPlace avoids provisioning
    new instances but is only available on some platforms — check the
    global pull secret doc for platform eligibility details.

- id: data-config-hash-code
  topic: data-plane
  depth: 2
  format: code
  question: |
    Open hypershift-operator/controllers/nodepool/config.go and find
    ConfigGenerator.Hash(). What exactly is hashed, and where does the
    resulting value matter downstream?
  rubric:
    must_cover:
      - Hash() calls supportutil.HashSimple over mcoRawConfig, the release image version, pullSecretName, additionalTrustBundleName, globalConfig, and rhelStream
      - The hash keys the token/userdata Secret pair for the NodePool
      - A changed hash produces a new dataSecretName on the MachineDeployment, which drives the CAPI rolling update
  source: hypershift-operator/controllers/nodepool/config.go
  why: |
    Every input to Hash() is a rollout trigger. When reviewing a PR that
    adds data to ignition configs or MachineConfigs, the question to ask is
    literally "does this change an input to this hash?" — if yes, every
    affected NodePool in the fleet rolls out on deploy.

- id: data-node-bootstrap
  topic: data-plane
  depth: 3
  format: scenario
  question: |
    A worker node's cloud instance booted, the CAPI Machine exists, but the
    node never joins the guest cluster. Walk the bootstrap path the node
    should have taken, and name the first thing you would check.
  rubric:
    must_cover:
      - The instance's userdata is an ignition stub containing the ignition server URL and a token UUID (from the userdata Secret)
      - The node GETs /ignition from the ignition server, authenticating with the token
      - The ignition server looks up the payload by token UUID (payload generated by the TokenSecretReconciler, which runs MCO binaries from the release image)
      - The node applies the ignition config, starts kubelet, joins the guest cluster, and its CSR is approved by the machine-approver
      - First checks — the token/userdata Secrets exist and the node can actually reach the ignition endpoint (Route 443, or Ignition Proxy 8443 under NodePort publishing)
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    "Machine exists but node never joins" almost always breaks in the
    ignition leg: expired/missing token, unreachable endpoint, or empty
    payload. The sequence diagram in the data plane onboarding doc is the
    map; ignition-server/controllers/tokensecret_controller.go is the code.

- id: data-autorepair
  topic: data-plane
  depth: 2
  format: mcq
  question: |
    A NodePool has `spec.management.autoRepair` enabled and one node's
    NodeReady condition stays False. What happens, roughly when?
  options:
    - text: The MachineHealthCheck marks the Machine unhealthy after several minutes (about 8 on cloud platforms, 16 on Agent/None) and deletes it; CAPI creates a replacement, bounded by MaxUnhealthy
      correct: true
    - text: The NodePool controller immediately deletes the node's Machine
      correct: false
    - text: The MachineHealthCheck reboots the machine in place
      correct: false
    - text: Nothing happens automatically; repair requires manual intervention
      correct: false
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    MHC creation lives in reconcileMachineHealthCheck in
    hypershift-operator/controllers/nodepool/capi.go. The 8 vs 16 minute
    timeouts reflect how quickly cloud vs bare-metal platforms can be
    expected to recover on their own, and MaxUnhealthy prevents a cascade
    that would take the whole pool down at once.

- id: data-ignition-what
  topic: data-plane
  depth: 1
  format: explain
  question: |
    In a sentence or two: what does ignition do for a worker node, and
    where does the node get its ignition config from?
  rubric:
    must_cover:
      - Ignition is the bootstrap mechanism applied on first boot — it writes files and units and starts the kubelet so the node joins the cluster
      - The cloud instance's userdata is a stub pointing at the ignition server URL with a token UUID
      - The node fetches the full payload from the ignition server (GET /ignition with the token) and applies it
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    Ignition runs exactly once per machine, at first boot, before kubelet
    exists — which is why config changes after bootstrap require replacing
    or updating the machine (rollouts), not re-running ignition.

- id: data-nodepool-fields
  topic: data-plane
  depth: 1
  format: code
  question: |
    Open api/hypershift/v1beta1/nodepool_types.go. Which spec field ties the
    NodePool to its HostedCluster, can it be changed, and which two fields
    control how many nodes it runs?
  rubric:
    must_cover:
      - spec.clusterName references the HostedCluster and is immutable
      - spec.replicas sets the node count manually (propagates to the MachineDeployment)
      - spec.autoScaling (min/max) hands count control to the cluster autoscaler via CAPI annotations
  source: api/hypershift/v1beta1/nodepool_types.go
  why: |
    clusterName being immutable means a NodePool can never be re-pointed at
    another cluster — delete and recreate instead. replicas vs autoScaling
    is manual control vs autoscaler control of the same underlying
    MachineDeployment replicas.

- id: data-scale-up
  topic: data-plane
  depth: 1
  format: scenario
  question: |
    A team needs five more nodes for their hosted cluster and asks whether
    they should scale the MachineDeployment. What do you tell them to
    change instead, and what propagates from that change?
  rubric:
    must_cover:
      - Change the NodePool (spec.replicas or spec.autoScaling), not the MachineDeployment
      - The NodePool controller propagates the desired count to the MachineDeployment, and CAPI scales the Machines
      - New cloud instances boot, fetch ignition, and join the guest cluster
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    The MachineDeployment is derived state — the NodePool controller owns
    it, so direct edits get reconciled away. The user-facing API is the
    NodePool; that is the contract.

- id: data-userdata-secret
  topic: data-plane
  depth: 1
  format: mcq
  question: |
    What does the userdata Secret handed to a cloud instance contain?
  options:
    - text: An ignition stub with the ignition server URL and a token UUID
      correct: true
    - text: The full ignition payload, generated by the NodePool controller
      correct: false
    - text: A kubeconfig for the node to register with
      correct: false
    - text: A cloud-init script that only installs SSH keys
      correct: false
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    The stub is deliberately tiny: the full payload (certs, configs,
    kubelet setup) is served by the ignition server, keyed by the token.
    This lets payloads be generated from the release image with MCO
    binaries and rotated independently of instance launch.

- id: data-proxy-rollout-gotcha
  topic: data-plane
  depth: 2
  format: scenario
  question: |
    After a control-plane-only version bump (no NodePool release change), a
    customer reports their NodePools rolled out new nodes — but only on
    clusters that set spec.configuration.proxy. Explain the chain that
    caused this.
  rubric:
    must_cover:
      - Those clusters run kubernetes-default-proxy as a static pod on worker nodes (an HTTP CONNECT proxy for KAS traffic), built from the CPO image
      - The image for that static pod is resolved from the HC release image
      - The changed image feeds the NodePool config hash
      - A new hash mints new token/userdata Secrets and a new DataSecretName, so CAPI performs a rolling update
  source: ARCHITECTURE.md
  why: |
    This is the fleet-wide rollout hazard called out in the repo's own
    guidance — any data that feeds the NodePool config hash rolls out every
    affected NodePool, even when the change feels control-plane-only.
    Always ask what feeds the hash.

- id: data-karpenter
  topic: data-plane
  depth: 3
  format: explain
  question: |
    A team wants node provisioning driven directly by pending pods, with
    their users creating NodePools in their own cluster's API. What does
    HyperShift offer for this, and how does it differ from the
    NodePool/MachineDeployment path?
  rubric:
    must_cover:
      - Karpenter — provisions nodes directly based on pending pods, bypassing MachineDeployments
      - The karpenter.sh CRDs (including NodePool) are installed in the guest cluster, so users manage them there — unlike HyperShift NodePool CRs, which live on the management cluster
      - The karpenter-operator reconciles Karpenter for the hosted cluster, and the karpenterignition controller handles ignition for Karpenter-provisioned nodes
      - The classic path is HyperShift NodePool → MachineDeployment → MachineSet → Machines, reconciled by the NodePool controller
  source: docs/content/getting-started/onboarding/data-plane.md
  why: |
    Karpenter flips two things at once: the provisioning trigger (pending
    pods instead of a desired replica count) and the API location
    (guest-side karpenter.sh CRDs instead of management-side HyperShift
    CRDs). It is the sanctioned exception to "no node management in the
    guest cluster".
